name: Build and Push to ECR

# 当面は手動実行のみ。Actionsタブの「Run workflow」から
# 任意のブランチ（mainを含む）を選んで実行する。
#
# 注意: workflow_dispatch はデフォルトブランチ（main）にこのファイルが
# 存在しないとActionsタブに現れない。初回だけmainへのマージが必要。
#
# 自動ビルドに戻す場合は以下のpushトリガーを復活させる:
#   push:
#     branches: [main]
#     paths: ["app/**", ".github/workflows/build-and-push.yml"]
on:
  workflow_dispatch:

# 同じブランチのビルドが重ならないようにする
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

# OIDCのIDトークン発行に必要。これが無いとAWSへの認証ができない
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: larabel-app-prod-app

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: AWSへOIDCで認証
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECRへログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@v3

      - name: イメージをビルドしてプッシュ
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/docker/php/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # GitHub Actionsのキャッシュを使ってcomposer/npmの再ダウンロードを避ける
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: プッシュしたイメージを表示
        run: |
          echo "### プッシュ完了 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest\`" >> $GITHUB_STEP_SUMMARY

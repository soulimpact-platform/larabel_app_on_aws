name: CI

# 当面は手動実行のみ。Actionsタブの「Run workflow」から
# 任意のブランチ（mainを含む）を選んで実行する。
#
# 注意: workflow_dispatch はデフォルトブランチ（main）にこのファイルが
# 存在しないとActionsタブに現れない。
#
# 自動ビルドに戻す場合は以下のpushトリガーを復活させる:
#   push:
#     branches: [main]
#     paths: ["app/**", ".github/workflows/ci.yml"]
on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "DBマイグレーションを実行する（チェックしない場合はビルドとデプロイのみ）"
        type: boolean
        default: false

# 同じブランチの実行が重ならないようにする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# OIDCのIDトークン発行に必要。これが無いとAWSへの認証ができない
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY_APP: larabel-app-prod-app
  ECR_REPOSITORY_NGINX: larabel-app-prod-nginx
  # 実行に必要な値（クラスタ名・タスク定義・コンテナ名・ロググループ・
  # ネットワーク構成・サービス名）はすべてこれらのSSMパラメータにJSONで入っている。
  # ワークフローがECS側について知る固定値はこの2つだけ
  ECS_MIGRATE_PARAM: /larabel-app/prod/ecs/migrate
  ECS_WEB_PARAM: /larabel-app/prod/ecs/web

jobs:
  ###########################################################################
  # イメージのビルドとECRへのpush
  #
  # 後続ジョブ（migrate / deploy）が使えるよう、
  # プッシュしたイメージのURIをoutputsで公開する
  ###########################################################################
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    # 本番環境向けの設定（AWS_DEPLOY_ROLE_ARN）はこのEnvironmentに紐づく。
    # 注意: environmentを指定するとOIDCのsubクレームが
    #   repo:<org>/<repo>:environment:app-prod
    # に変わる。信頼ポリシー(allowed_subjects)も同じ値にしておくこと。
    environment: app-prod

    outputs:
      app_image_uri: ${{ steps.meta.outputs.app_image_uri }}
      nginx_image_uri: ${{ steps.meta.outputs.nginx_image_uri }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: AWSへOIDCで認証
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECRへログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: イメージタグを決定
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          {
            echo "image_tag=${IMAGE_TAG}"
            echo "app_image_uri=${REGISTRY}/${ECR_REPOSITORY_APP}:${IMAGE_TAG}"
            echo "nginx_image_uri=${REGISTRY}/${ECR_REPOSITORY_NGINX}:${IMAGE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@v3

      # nginxとphp-fpmは同一タスクの2コンテナとして動くため、
      # 必ず同じコミットからビルドして同じタグを付ける
      - name: アプリイメージ(php-fpm)をビルドしてプッシュ
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/docker/php/Dockerfile
          # イメージは環境non依存。stagingにもproductionにも同じものを配る
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_APP }}:latest
          # GitHub Actionsのキャッシュを使ってcomposer/npmの再ダウンロードを避ける
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nginxイメージをビルドしてプッシュ
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/docker/php/Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ steps.meta.outputs.nginx_image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NGINX }}:latest
          # vendor/assetsステージはアプリ側でビルド済みなのでキャッシュが効く
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: プッシュしたイメージを表示
        run: |
          {
            echo "### プッシュ完了 :rocket:"
            echo ""
            echo "- \`${{ steps.meta.outputs.app_image_uri }}\`"
            echo "- \`${{ steps.meta.outputs.nginx_image_uri }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ###########################################################################
  # DBマイグレーション（任意実行 + 承認制の二段構え）
  #
  #   run_migrate 未チェック → このジョブはスキップされ、deployへ直行する
  #   run_migrate チェック   → 承認待ちで停止し、承認すると実行される
  #
  # 「今回マイグレーションを伴うか」は実行前に分かっている情報なので
  # チェックボックスで指定し、「実際に本番へ当ててよいか」は
  # buildの結果を見てから承認で判断する、という分担にしている。
  #
  # 注意: 却下(Reject)は「スキップ」ではなく「失敗」として扱われるため、
  # 却下するとdeployも止まる。マイグレーション不要なら最初から
  # チェックを外して実行すること。
  ###########################################################################
  migrate:
    name: Run database migration
    needs: build
    if: ${{ inputs.run_migrate }}
    runs-on: ubuntu-latest

    # 承認ゲート用。app-prod とは別環境にすることで、
    # 通常のビルドには承認を要求せずにmigrateだけ止められる
    environment: app-prod-migrate

    steps:
      - name: AWSへOIDCで認証
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # クラスタ名・タスク定義・ネットワーク構成などをまとめて取得する。
      # これ以降のステップはワークフロー内に値をハードコードしない
      - name: 実行パラメータを取得
        id: cfg
        run: |
          set -euo pipefail

          CFG=$(aws ssm get-parameter \
            --name "$ECS_MIGRATE_PARAM" \
            --query Parameter.Value --output text)

          {
            echo "cluster=$(jq -r .cluster <<<"$CFG")"
            echo "family=$(jq -r .taskDefinitionFamily <<<"$CFG")"
            echo "container=$(jq -r .containerName <<<"$CFG")"
            echo "log_group=$(jq -r .logGroup <<<"$CFG")"
            echo "network=$(jq -c .networkConfiguration <<<"$CFG")"
          } >> "$GITHUB_OUTPUT"

      # run-task では image を上書きできないため、
      # buildでpushしたイメージを指す新しいリビジョンを登録する
      - name: タスク定義を新しいイメージで登録
        id: taskdef
        env:
          IMAGE_URI: ${{ needs.build.outputs.app_image_uri }}
          FAMILY: ${{ steps.cfg.outputs.family }}
          CONTAINER: ${{ steps.cfg.outputs.container }}
        run: |
          set -euo pipefail

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition)

          NEW=$(echo "$CURRENT" | jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg NAME "$CONTAINER" '
              .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
              | del(
                  .taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy
                )
            ')

          ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW" \
            --query taskDefinition.taskDefinitionArn --output text)

          echo "リビジョンを登録しました: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: migrateタスクを実行して完了まで待つ
        id: run
        env:
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          NETWORK_CONFIG: ${{ steps.cfg.outputs.network }}
        run: |
          set -euo pipefail

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)

          echo "起動しました: $TASK_ARN"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "task_id=${TASK_ARN##*/}" >> "$GITHUB_OUTPUT"

          echo "完了を待機しています..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

      # 成否にかかわらずログを出す。失敗時はここが唯一の手がかりになる
      - name: 実行ログを表示
        if: always() && steps.run.outputs.task_id != ''
        env:
          TASK_ID: ${{ steps.run.outputs.task_id }}
          LOG_GROUP: ${{ steps.cfg.outputs.log_group }}
          CONTAINER: ${{ steps.cfg.outputs.container }}
        run: |
          set -uo pipefail
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "migrate/${CONTAINER}/${TASK_ID}" \
            --query 'events[].message' --output text || echo "ログをまだ取得できませんでした"

      - name: 終了コードを判定
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          CONTAINER: ${{ steps.cfg.outputs.container }}
        run: |
          set -euo pipefail

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${CONTAINER}'].exitCode | [0]" \
            --output text)

          echo "終了コード: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::マイグレーションが失敗しました（終了コード ${EXIT_CODE}）"
            exit 1
          fi

  ###########################################################################
  # Webサービスのデプロイ
  #
  # migrateが「スキップ」されても進むが、「失敗」した場合は止める。
  # 旧スキーマのDBに新しいコードを載せる事故を防ぐため。
  #
  # ※ needs に指定したジョブがスキップされると依存側もスキップされるのが
  #   既定動作のため !cancelled() が必須。always() だとワークフローを
  #   キャンセルしてもdeployが走ってしまうので使わない。
  ###########################################################################
  deploy:
    name: Deploy web service
    needs: [build, migrate]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.migrate.result != 'failure' }}
    runs-on: ubuntu-latest

    environment: app-prod

    steps:
      - name: AWSへOIDCで認証
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: デプロイパラメータを取得
        id: cfg
        run: |
          set -euo pipefail

          CFG=$(aws ssm get-parameter \
            --name "$ECS_WEB_PARAM" \
            --query Parameter.Value --output text)

          {
            echo "cluster=$(jq -r .cluster <<<"$CFG")"
            echo "service=$(jq -r .service <<<"$CFG")"
            echo "family=$(jq -r .taskDefinitionFamily <<<"$CFG")"
            echo "url=$(jq -r .url <<<"$CFG")"
          } >> "$GITHUB_OUTPUT"

      # nginxとappの2コンテナ分のimageを、同じコミットのものへ差し替える
      - name: タスク定義を新しいイメージで登録
        id: taskdef
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image_uri }}
          NGINX_IMAGE: ${{ needs.build.outputs.nginx_image_uri }}
          FAMILY: ${{ steps.cfg.outputs.family }}
        run: |
          set -euo pipefail

          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition)

          NEW=$(echo "$CURRENT" | jq \
            --arg APP "$APP_IMAGE" \
            --arg NGINX "$NGINX_IMAGE" '
              .containerDefinitions |= map(
                  if   .name == "app"   then .image = $APP
                  elif .name == "nginx" then .image = $NGINX
                  else . end
                )
              | del(
                  .taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy
                )
            ')

          ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW" \
            --query taskDefinition.taskDefinitionArn --output text)

          echo "リビジョンを登録しました: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # サービスを新リビジョンへ更新する。
      # deployment_circuit_breaker が有効なので、新タスクがヘルスチェックを
      # 通らない場合はAWS側が自動で前のリビジョンへロールバックする
      - name: サービスを更新して安定するまで待つ
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          SERVICE: ${{ steps.cfg.outputs.service }}
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --query 'service.deployments[0].{Status:status,Desired:desiredCount}' \
            --output json

          echo "デプロイの完了を待機しています（数分かかります）..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: デプロイ結果を表示
        if: always()
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          SERVICE: ${{ steps.cfg.outputs.service }}
          APP_URL: ${{ steps.cfg.outputs.url }}
        run: |
          set -uo pipefail

          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].{TaskDefinition:taskDefinition,Running:runningCount,Desired:desiredCount,Status:status}' \
            --output table

          {
            echo "### デプロイ完了 :ship:"
            echo ""
            echo "- URL: ${APP_URL}"
            echo "- イメージタグ: \`${{ needs.build.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

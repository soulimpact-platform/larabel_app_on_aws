services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    environment:
      # 別コンテナのphp-fpmへサービス名で接続する（ECSでは127.0.0.1になる）
      FASTCGI_PASS: php:9000
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/templates:/etc/nginx/templates
    depends_on:
      - php
    networks:
      - laravel

  php:
    build:
      # prodステージが src/ をCOPYするため、コンテキストは app/ 全体にする
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "13306:3306"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data:
    driver: local
